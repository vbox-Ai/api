name: Update Cloud Source URLs

on:
  schedule:
    # 每3天 UTC 10:00 执行一次（北京时间 18:00）
    - cron: "0 10 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 1) 从监控 API 更新通用云盘源域名
      - name: Update cloud source URLs from monitor
        continue-on-error: true
        run: python domain-monitor/update_cloud_urls.py

      # 2) 从 LIBVIO 发布页解码并更新备用线路域名
      - name: Update LIBVIO backup domains
        continue-on-error: true
        run: python domain-monitor/update_libvio_urls.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add sources/cloud_sources.json domain-monitor/backups/
          git commit -m "chore: auto update cloud URLs & LIBVIO domains ($(date -u +%Y-%m-%d))" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push

      - name: Send email notification
        if: always() && !cancelled()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: ${{ job.status == 'success' && '✅' || '❌' }} vbox 云盘域名自动更新
          to: ${{ env.MAIL_TO }}
          from: ${{ env.SMTP_USERNAME }}
          body: |
            云盘域名自动更新${{ job.status == 'success' && '成功' || '失败' }}

            构建状态: ${{ job.status }}
            工作流: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
