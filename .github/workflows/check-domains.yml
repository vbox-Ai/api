name: Check Source Domains

on:
  push:
    branches:
      - main
    paths:
      - "sources/**"
      - "domain-monitor/merge_sources.py"
      - "domain-monitor/extract_domains.py"
      - "domain-monitor/check_domains.py"
      - ".github/workflows/check-domains.yml"
      - "README.md"
      - "docs/**"
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

# 排队执行，避免与 validate-sources 同时 push 导致冲突
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # ── Job 1: 合并源文件（轻量，始终执行） ──
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Merge sources
        run: python domain-monitor/merge_sources.py

      - name: Commit merge results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add sources/all_sources.json sources/manifest.json sources/manifest.version
          git diff --cached --quiet || git commit -m "chore: auto merge sources"

          # 带重试的 push
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              echo "Push succeeded on attempt $i"
              break
            fi
            echo "Push failed on attempt $i, retrying in 10s..."
            sleep 10
          done

  # ── Job 2: 域名检测（定时/手动触发，失败不影响合并） ──
  check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract domains
        run: python domain-monitor/extract_domains.py

      - name: Check domains
        run: python domain-monitor/check_domains.py

      - name: Commit domain check results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add domain-monitor/domains.json domain-monitor/domains.txt domain-monitor/check-results.json domain-monitor/check-results.md
          git diff --cached --quiet || git commit -m "chore: update domain check results"

          for i in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              echo "Push succeeded on attempt $i"
              break
            fi
            echo "Push failed on attempt $i, retrying in 10s..."
            sleep 10
          done

      - name: Send email
        if: ${{ env.SMTP_SERVER != '' && env.SMTP_PORT != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.MAIL_TO != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: vbox 远程源每周检测报告
          to: ${{ env.MAIL_TO }}
          from: ${{ env.SMTP_USERNAME }}
          body: file://domain-monitor/check-results.md
