name: Validate Sources

on:
  push:
    branches:
      - main
    paths:
      - "sources/**"
  pull_request:
    branches:
      - main
    paths:
      - "sources/**"
  workflow_dispatch:

permissions:
  contents: write

# 排队执行，避免与 check-domains 同时 push 导致冲突
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate JSON files
        run: |
          import json, os, sys, glob

          errors = []
          source_dir = "sources"
          json_files = sorted(glob.glob(f"{source_dir}/*.json"))

          if not json_files:
              print("WARNING: No JSON files found in sources/")
              sys.exit(0)

          print(f"Found {len(json_files)} JSON files to validate\n")

          for f in json_files:
              try:
                  with open(f, "r", encoding="utf-8") as fh:
                      data = json.load(fh)
                  print(f"  OK  {f}")
              except json.JSONDecodeError as e:
                  errors.append(f"  FAIL {f}: {e}")
                  print(f"  FAIL {f}: {e}")
              except Exception as e:
                  errors.append(f"  FAIL {f}: {e}")
                  print(f"  FAIL {f}: {e}")

          print()
          if errors:
              print(f"ERROR: {len(errors)} file(s) failed validation")
              for e in errors:
                  print(e)
              sys.exit(1)
          else:
              print(f"SUCCESS: All {len(json_files)} files are valid JSON")
              sys.exit(0)
        shell: python

      - name: Validate manifest structure
        run: |
          import json, sys

          with open("sources/manifest.json", "r", encoding="utf-8") as f:
              manifest = json.load(f)

          required_fields = ["schemaVersion", "configVersion", "files"]
          missing = [f for f in required_fields if f not in manifest]
          if missing:
              print(f"ERROR: manifest.json missing fields: {missing}")
              sys.exit(1)

          # 新版：只检查 allSources；兼容旧版 6 字段
          files = manifest.get("files", {})
          has_all_sources = "allSources" in files
          has_old_files = all(f in files for f in ["apiSources", "cloudSources", "spiderSources",
                                                     "domainOverrides", "parsers", "disabledSources"])
          if not has_all_sources and not has_old_files:
              print("ERROR: manifest.files must contain 'allSources' (new) or all 6 legacy fields")
              sys.exit(1)

          print(f"SUCCESS: manifest.json structure valid (configVersion={manifest['configVersion']})")
          if has_all_sources:
              print(f"  All Sources: {files['allSources']}")
              print(f"  Welfare Platforms: {files.get('welfarePlatforms', 'N/A')}")
          else:
              print(f"  API Sources: {files.get('apiSources', 'N/A')}")
              print(f"  Cloud Sources: {files.get('cloudSources', 'N/A')}")
              print(f"  Spider Sources: {files.get('spiderSources', 'N/A')}")
              print(f"  Domain Overrides: {files.get('domainOverrides', 'N/A')}")
              print(f"  Parsers: {files.get('parsers', 'N/A')}")
              print(f"  Disabled Sources: {files.get('disabledSources', 'N/A')}")
        shell: python

      - name: Validate welfare_platforms.json structure
        run: |
          import json, sys
          from pathlib import Path

          wp_path = Path("sources/welfare_platforms.json")
          if not wp_path.exists():
              print("INFO: welfare_platforms.json not found (skip validation)")
              sys.exit(0)

          with open(wp_path, "r", encoding="utf-8") as f:
              data = json.load(f)

          errors = []

          # 1. 顶层必需字段
          for field in ["schemaVersion", "categories", "platforms"]:
              if field not in data:
                  errors.append(f"  MISSING top-level field: {field}")

          # 2. categories 必须为非空数组
          categories = data.get("categories", [])
          if not isinstance(categories, list) or len(categories) == 0:
              errors.append("  categories must be a non-empty array")

          cat_keys = {c.get("key") for c in categories if isinstance(c, dict)}
          required_cat_keys = {"video", "live"}
          missing_cat_keys = required_cat_keys - cat_keys
          if missing_cat_keys:
              errors.append(f"  categories missing required keys: {missing_cat_keys}")

          # 3. platforms 必须为数组
          platforms = data.get("platforms", [])
          if not isinstance(platforms, list):
              errors.append("  platforms must be an array")
              platforms = []

          # 4. 每个 platform 必须有必需字段
          required_platform_fields = {
              "platformKey", "name", "category", "icon",
              "defaultHosts", "sortOrder"
          }
          seen_keys = set()
          for i, p in enumerate(platforms):
              if not isinstance(p, dict):
                  errors.append(f"  platforms[{i}] is not an object")
                  continue
              missing = required_platform_fields - set(p.keys())
              if missing:
                  errors.append(f"  platforms[{i}] ({p.get('name', '?')}) missing fields: {missing}")
              # 唯一性校验
              pk = p.get("platformKey")
              if not pk:
                  errors.append(f"  platforms[{i}] ({p.get('name', '?')}) platformKey is empty")
              elif pk in seen_keys:
                  errors.append(f"  platforms[{i}] duplicate platformKey: {pk}")
              else:
                  seen_keys.add(pk)
              # category 必须在已定义 categories 中
              if p.get("category") not in cat_keys:
                  errors.append(f"  platforms[{i}] ({pk}) category='{p.get('category')}' not in categories")
              # defaultHosts 必须为非空字符串数组
              hosts = p.get("defaultHosts", [])
              if not isinstance(hosts, list) or len(hosts) == 0:
                  errors.append(f"  platforms[{i}] ({pk}) defaultHosts must be a non-empty array")
              else:
                  for h in hosts:
                      if not isinstance(h, str) or not (h.startswith("http://") or h.startswith("https://")):
                          errors.append(f"  platforms[{i}] ({pk}) invalid host: {h}")
                          break

          # 5. 排除的平台不应出现在 platforms 中（避免误迁移）
          excluded = {"MissAV", "One平台", "麻豆平台"}
          for p in platforms:
              if p.get("name") in excluded:
                  errors.append(f"  EXCLUDED platform detected: {p.get('name')} (platformKey={p.get('platformKey')})")

          if errors:
              print("ERROR: welfare_platforms.json validation failed")
              for e in errors:
                  print(e)
              sys.exit(1)
          else:
              print(f"SUCCESS: welfare_platforms.json structure valid ({len(platforms)} platforms across {len(categories)} categories)")
              for c in categories:
                  cat_name = c.get("name", c.get("key"))
                  count = sum(1 for p in platforms if p.get("category") == c.get("key"))
                  print(f"  {cat_name}: {count} platforms")
        shell: python

      - name: Detect source changes
        run: |
          import json, os, sys, hashlib

          BASELINE = "sources/.source-baseline.json"

          def extract_counts():
              counts = {}
              detail = {}

              # api_sources.json
              try:
                  with open("sources/api_sources.json", "r") as f:
                      data = json.load(f)
                  sites = data.get("sites", [])
                  counts["api_sources"] = len(sites)
                  detail["api_sources"] = {s.get("key", "?"): s.get("name", "?") for s in sites}
              except: pass

              # cloud_sources.json
              try:
                  with open("sources/cloud_sources.json", "r") as f:
                      data = json.load(f)
                  cloud = data.get("cloudSites", [])
                  counts["cloud_sources"] = len(cloud)
                  detail["cloud_sources"] = {s.get("name", "?"): s.get("name", "?") for s in cloud}
              except: pass

              # spider_sources.json
              try:
                  with open("sources/spider_sources.json", "r") as f:
                      data = json.load(f)
                  sites = data.get("sites", [])
                  counts["spider_sources"] = len(sites)
                  detail["spider_sources"] = {s.get("key", "?"): s.get("name", "?") for s in sites}
              except: pass

              # domain_overrides.json
              try:
                  with open("sources/domain_overrides.json", "r") as f:
                      data = json.load(f)
                  overrides = data.get("overrides", [])
                  counts["domain_overrides"] = len(overrides)
              except: pass

              # parsers.json
              try:
                  with open("sources/parsers.json", "r") as f:
                      data = json.load(f)
                  parses = data.get("parses", [])
                  counts["parsers"] = len(parses)
              except: pass

              # disabled_sources.json
              try:
                  with open("sources/disabled_sources.json", "r") as f:
                      data = json.load(f)
                  keys = data.get("disabledKeys", [])
                  hosts = data.get("disabledHosts", [])
                  counts["disabled_sources"] = {"keys": len(keys), "hosts": len(hosts)}
              except: pass

              # welfare_platforms.json（福利专区远程配置）
              try:
                  with open("sources/welfare_platforms.json", "r") as f:
                      data = json.load(f)
                  plats = data.get("platforms", [])
                  counts["welfare_platforms"] = len(plats)
                  detail["welfare_platforms"] = {
                      p.get("platformKey", "?"): p.get("name", "?")
                      for p in plats if isinstance(p, dict)
                  }
              except: pass

              return counts, detail

          current_counts, current_detail = extract_counts()

          print("Current source counts:")
          for k, v in current_counts.items():
              print(f"  {k}: {v}")

          print("\n--- Source Change Report ---")

          if os.path.exists(BASELINE):
              with open(BASELINE, "r") as f:
                  baseline = json.load(f)

              changes = []
              old_counts = baseline.get("counts", {})
              old_detail = baseline.get("detail", {})

              for file_key in current_counts:
                  old = old_counts.get(file_key)
                  new = current_counts[file_key]

                  if isinstance(new, dict):
                      old_keys = old.get("keys", 0) if isinstance(old, dict) else 0
                      new_keys = new.get("keys", 0)
                      old_hosts = old.get("hosts", 0) if isinstance(old, dict) else 0
                      new_hosts = new.get("hosts", 0)
                      if old_keys != new_keys:
                          changes.append(f"  {file_key}: disabledKeys {old_keys} → {new_keys}")
                      if old_hosts != new_hosts:
                          changes.append(f"  {file_key}: disabledHosts {old_hosts} → {new_hosts}")
                  elif old is not None and old != new:
                      delta = new - old
                      sign = "+" if delta > 0 else ""
                      changes.append(f"  {file_key}: {old} → {new} ({sign}{delta})")

                      # Show added/removed sources
                      if file_key in current_detail and file_key in old_detail:
                          old_keys = set(old_detail.get(file_key, {}).keys())
                          new_keys = set(current_detail.get(file_key, {}).keys())
                          added = new_keys - old_keys
                          removed = old_keys - new_keys
                          if added:
                              for k in sorted(added):
                                  changes.append(f"    + {current_detail[file_key][k]}")
                          if removed:
                              for k in sorted(removed):
                                  changes.append(f"    - {old_detail[file_key].get(k, k)}")
                  elif old is None and new != 0:
                      # 新增的计数项（baseline 中尚未记录），仅在非零时报告
                      changes.append(f"  {file_key}: NEW → {new} (+{new})")
                      if file_key in current_detail:
                          for k in sorted(current_detail[file_key].keys()):
                              changes.append(f"    + {current_detail[file_key][k]}")

              if changes:
                  print("CHANGES DETECTED:")
                  for c in changes:
                      print(c)
                  print(f"\n::notice title=Source Changes::{len(changes)} change(s) detected in sources/")
              else:
                  print("No changes detected (source counts unchanged).")
          else:
              print("No baseline found — creating initial baseline.")
              changes = []

          # Save/update baseline
          os.makedirs(os.path.dirname(BASELINE), exist_ok=True)
          baseline_data = {"counts": current_counts, "detail": current_detail}
          with open(BASELINE, "w") as f:
              json.dump(baseline_data, f, indent=2, ensure_ascii=False, sort_keys=True)
          print(f"\nBaseline updated: {BASELINE}")
        shell: python

      - name: Commit baseline
        if: success() && github.event_name == 'push'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add sources/.source-baseline.json
          git diff --cached --quiet || git commit -m "chore: update source baseline"

          # 带重试的 push，避免与 check-domains 竞争导致失败
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $i"
              break
            fi
            echo "Push failed on attempt $i, retrying in 10s..."
            sleep 10
          done

      - name: Send email notification
        if: always() && !cancelled()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: ${{ job.status == 'success' && '✅' || '❌' }} vbox 远程源配置验证 - ${{ github.ref_name }}
          to: ${{ env.MAIL_TO }}
          from: ${{ env.SMTP_USERNAME }}
          body: |
            远程源配置验证${{ job.status == 'success' && '成功' || '失败' }}

            分支: ${{ github.ref_name }}
            提交信息: ${{ github.event.head_commit.message }}
            构建状态: ${{ job.status }}
            工作流: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
